# 데스크톱 앱(Mac .dmg · Windows .exe)을 만들어 GitHub Releases 에 올린다.
# 버전 태그(v1.2.3)를 푸시하면 실행된다. Actions 탭에서 수동 실행하면 빌드만 하고 결과물을 Artifacts 로 남긴다.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows 테스트는 아직 실기 검증 전이라, 실패해도 설치 파일은 만들고 결과만 남긴다.
      - run: npm test
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      # 태그 빌드면 앱 버전을 태그에 맞춘다 (새 버전 알림이 이 값으로 비교한다).
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DOMO-${{ matrix.os }}
          path: |
            dist/DOMO-mac.dmg
            dist/DOMO-windows.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "DOMO ${GITHUB_REF_NAME#v}" --generate-notes || true
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" dist/DOMO-*.dmg dist/DOMO-*.exe --clobber
